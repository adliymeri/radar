name: CI/CD Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/bimmingo
            git fetch origin
            git checkout ${{ github.event.inputs.branch || 'main' }}
            git pull origin ${{ github.event.inputs.branch || 'main' }}

            # Login to GitHub Container Registry
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Update image tag
            export IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}

            # Backup current tag for rollback
            if [ -f /opt/bimmingo/.current_tag ]; then
              cp /opt/bimmingo/.current_tag /opt/bimmingo/.previous_tag
            fi
            echo "$IMAGE_TAG" > /opt/bimmingo/.current_tag

            # Update IMAGE_TAG in .env
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$IMAGE_TAG/" .env

            # Pull new image
            docker compose pull chatapp daemon notification api

            # Deploy with new image
            docker compose up -d

            # Wait for services
            sleep 15

            # Health check
            FAILED=0
            for SERVICE in chatapp daemon notification api postgres rabbitmq caddy; do
              if ! docker compose ps --format "{{.Status}}" "$SERVICE" | grep -q "Up"; then
                echo "❌ $SERVICE FAILED"
                FAILED=1
              fi
            done

            # Rollback on failure
            if [ "$FAILED" -eq 1 ]; then
              echo "⚠️ Deployment failed, rolling back..."
              if [ -f /opt/bimmingo/.previous_tag ]; then
                PREV_TAG=$(cat /opt/bimmingo/.previous_tag)
                sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$PREV_TAG/" .env
                docker compose pull chatapp daemon notification api
                docker compose up -d
                echo "🔙 Rolled back to $PREV_TAG"
              fi
              exit 1
            fi

            echo "✅ Deployment successful - tag: $IMAGE_TAG"