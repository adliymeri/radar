networks:
  radar_network:

services:
  postgres:
    image: postgres:17.4-alpine3.21
    environment:
      TZ: "UTC"
      PGTZ: "UTC"
      POSTGRES_USER: root
      POSTGRES_PASSWORD: radarapp2025
      POSTGRES_DB: radar
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./src/infrastructure/db/migrations:/docker-entrypoint-initdb.d
    networks:
      - radar_network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: radar
      RABBITMQ_DEFAULT_PASS: radarapp2025
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - radar_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  rabbitmq_data: